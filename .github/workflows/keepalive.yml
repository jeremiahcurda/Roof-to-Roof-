name: Keep time clock database awake

# Supabase's free plan pauses a project after about a week without activity.
# This pings a small function once a day so the time clock keeps working.
on:
  schedule:
    - cron: "23 14 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/keepalive.yml"

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the database
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 20 --retry-all-errors --max-time 60 \
            -X POST "https://kcrvdqbubwtpykzdfyqa.supabase.co/functions/v1/timeclock-keepalive" \
            -H "apikey: sb_publishable_tnLp-i_c3aIpIVJennQQZA_CfB99xQi" \
            -H "Content-Type: application/json" \
            -d '{}'
