<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640">
  <defs>
    <style>
      .rr-black { fill: #171717; }
      .rr-green { fill: #1b7a2e; }
      .rr-title {
        font-family: 'Arial Black', 'Arial Bold', Arial, sans-serif;
        font-weight: 900;
        fill: #171717;
        letter-spacing: 4px;
      }
      .rr-relief {
        font-family: 'Arial Black', 'Arial Bold', Arial, sans-serif;
        font-weight: 900;
        fill: #1b7a2e;
        letter-spacing: 10px;
      }
      .rr-tagline1 {
        font-family: Georgia, 'Times New Roman', serif;
        font-style: italic;
        font-weight: 700;
        fill: #171717;
      }
      .rr-tagline2 {
        font-family: Georgia, 'Times New Roman', serif;
        font-weight: 700;
        fill: #1b7a2e;
      }
    </style>
  </defs>

  <!-- ============ TREE (left of roofline) ============ -->
  <g>
    <rect x="148" y="205" width="20" height="72" rx="4" class="rr-black"/>
    <g class="rr-green">
      <circle cx="158" cy="118" r="58"/>
      <circle cx="110" cy="148" r="42"/>
      <circle cx="206" cy="148" r="42"/>
      <circle cx="135" cy="184" r="38"/>
      <circle cx="182" cy="184" r="38"/>
      <circle cx="158" cy="194" r="34"/>
    </g>
  </g>

  <!-- ============ ROOFLINE + CHIMNEY ============ -->
  <path d="M 218 270
           L 320 158
           L 336 158
           L 336 84
           L 386 84
           L 386 158
           L 358 158
           L 460 270
           L 522 204
           L 530 204
           L 596 270"
        fill="none" stroke="#171717" stroke-width="26"
        stroke-linejoin="round" stroke-linecap="round"/>

  <!-- window (2x2 pane) set into the main gable -->
  <g class="rr-green">
    <rect x="316" y="192" width="76" height="76" rx="4" fill="none" stroke="#1b7a2e" stroke-width="14"/>
    <rect x="349" y="192" width="10" height="76"/>
    <rect x="316" y="225" width="76" height="10"/>
  </g>

  <!-- ============ GRASS / GROUND SWOOSH ============ -->
  <path d="M 176 296
           C 220 264, 260 316, 312 292
           C 366 266, 420 300, 470 290
           C 530 278, 570 300, 620 288
           C 660 278, 690 260, 716 278"
        fill="none" stroke="#1b7a2e" stroke-width="12" stroke-linecap="round"/>
  <path d="M 176 296 C 150 300, 128 292, 126 268 C 125 250, 138 240, 152 244" fill="none" stroke="#1b7a2e" stroke-width="9" stroke-linecap="round"/>
  <path d="M 716 278 C 742 272, 756 254, 748 234 C 743 220, 728 216, 718 224" fill="none" stroke="#1b7a2e" stroke-width="9" stroke-linecap="round"/>

  <!-- ============ TITLE: ROOT TO ROOF ============ -->
  <text x="450" y="400" text-anchor="middle" class="rr-title" font-size="98">ROOT TO ROOF</text>

  <!-- ============ RELIEF with flanking rules ============ -->
  <line x1="212" y1="452" x2="342" y2="452" stroke="#171717" stroke-width="5"/>
  <text x="450" y="465" text-anchor="middle" class="rr-relief" font-size="52">RELIEF</text>
  <line x1="558" y1="452" x2="688" y2="452" stroke="#171717" stroke-width="5"/>

  <!-- ============ TAGLINE ============ -->
  <text x="450" y="528" text-anchor="middle" class="rr-tagline1" font-size="32">From your lawn to your roof,</text>
  <text x="450" y="568" text-anchor="middle" class="rr-tagline2" font-size="34" font-weight="700">we&#8217;ve got you covered!</text>
</svg>
